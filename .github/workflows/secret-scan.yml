name: secret-scan

on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the whole point is scanning every commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python -m unittest discover -s tests -v
      - name: Scan history
        run: stm . --html stm-report.html --fail-on live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-timeline
          path: stm-report.html
